name: Build Template DLL (Windows)

on:
  push:
    branches: [master]
    paths:
      - 'template/**'
  workflow_dispatch:

jobs:
  build-template-dll:
    name: Build Template Inject DLL
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Create build directory
      shell: cmd
      run: |
        mkdir template_build
        cd template_build
        
    - name: Configure CMake for Template
      shell: cmd
      run: |
        cmake -B template_build ^
          -S template ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_D3D9=ON ^
          -DBUILD_D3D10=ON ^
          -DBUILD_D3D11=ON ^
          -DBUILD_D3D12=ON ^
          -DBUILD_OPENGL=ON
          
    - name: Build Template DLL
      shell: cmd
      run: |
        cmake --build template_build --config Release
        
    - name: Create release package
      shell: bash
      run: |
        mkdir -p template_release/bin
        mkdir -p template_release/include
        cp template_build/bin/MyInjectLibrary.dll template_release/bin/
        cp template/ns_overlay.h template_release/include/
        cp template/README.md template_release/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: template-inject-dll
        path: template_release/
        retention-days: 30
