name: Build ImGui & Template DLL (Windows)

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-imgui-lib:
    name: Build ImGui Static Library (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        
    - name: Create build directory
      shell: cmd
      run: mkdir build_${{ matrix.arch }}
      
    - name: Configure CMake
      shell: cmd
      run: |
        cmake -B build_${{ matrix.arch }} ^
          -S . ^
          -G "Visual Studio 17 2022" ^
          -A ${{ matrix.arch == 'x64' && 'x64' || 'Win32' }} ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF
          
    - name: Build ImGui Core
      shell: cmd
      run: cmake --build build_${{ matrix.arch }} --config Release --target imgui
      
    - name: Build C API
      shell: cmd
      run: |
        cl /c /O2 /I. /Ibackends c_api/imgui_c_api.cpp /Fobuild_${{ matrix.arch }}/imgui_c_api.obj
        lib /OUT:build_${{ matrix.arch }}/imgui_${{ matrix.arch }}.lib build_${{ matrix.arch }}/imgui_c_api.obj
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: imgui-windows-static-lib-${{ matrix.arch }}
        path: build_${{ matrix.arch }}/
        retention-days: 1

  build-template-dll:
    name: Build Template Inject DLL (${{ matrix.arch }})
    runs-on: windows-latest
    needs: build-imgui-lib
    strategy:
      matrix:
        arch: [x86, x64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download ImGui artifacts (x86)
      uses: actions/download-artifact@v4
      with:
        name: imgui-windows-static-lib-x86
        path: lib/x86
        
    - name: Download ImGui artifacts (x64)
      uses: actions/download-artifact@v4
      with:
        name: imgui-windows-static-lib-x64
        path: lib/x64
        
    - name: Setup MSVC (${{ matrix.arch }})
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        
    - name: Create build directory
      shell: cmd
      run: mkdir template_build
        
    - name: Configure CMake for Template
      shell: cmd
      run: |
        cmake -B template_build ^
          -S template ^
          -G "Visual Studio 17 2022" ^
          -A ${{ matrix.arch == 'x64' && 'x64' || 'Win32' }} ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DIMGUI_LIB_PATH=${{ github.workspace }}/lib/${{ matrix.arch }}/imgui_${{ matrix.arch }}.lib ^
          -DBUILD_D3D9=ON ^
          -DBUILD_D3D10=ON ^
          -DBUILD_D3D11=ON ^
          -DBUILD_OPENGL=ON
          
    - name: Build Template DLL
      shell: cmd
      run: cmake --build template_build --config Release
      
    - name: Create release package
      shell: bash
      run: |
        mkdir -p template_release/bin/${{ matrix.arch }}
        cp template_build/Release/MyInjectLibrary.dll template_release/bin/${{ matrix.arch }}/
        # Copy corresponding lib
        mkdir -p template_release/lib/${{ matrix.arch }}
        cp lib/${{ matrix.arch }}/imgui_${{ matrix.arch }}.lib template_release/lib/${{ matrix.arch }}/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: template-inject-dll-${{ matrix.arch }}
        path: template_release/
        retention-days: 30
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          lib/x86/imgui_x86.lib
          lib/x64/imgui_x64.lib
          c_api/imgui_c_api.h
          imgui.h
          imconfig.h
          template_release/**
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
