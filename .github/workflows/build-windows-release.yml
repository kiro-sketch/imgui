name: Build ImGui Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-imgui-lib:
    name: Build ImGui Static Library
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Create build directory
      shell: cmd
      run: |
        mkdir build
        cd build
        
    - name: Configure CMake
      shell: cmd
      run: |
        cmake -B build ^
          -S . ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF
          
    - name: Build ImGui Core
      shell: cmd
      run: |
        cmake --build build --config Release --target imgui
        
    - name: Build C API
      shell: cmd
      run: |
        cl /c /O2 /I. /Ibackends c_api/imgui_c_api.cpp /Fobuild/imgui_c_api.obj
        lib /OUT:build/imgui.lib build/imgui_c_api.obj
        
    - name: Create release package
      shell: bash
      run: |
        mkdir -p release/include
        mkdir -p release/lib
        cp c_api/imgui_c_api.h release/include/
        cp imgui.h release/include/
        cp imconfig.h release/include/
        cp imgui_internal.h release/include/
        cp backends/*.h release/include/
        cp build/imgui.lib release/lib/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: imgui-windows-static-lib
        path: release/
        retention-days: 30
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/**
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-template-dll:
    name: Build Template DLL
    runs-on: windows-latest
    needs: build-imgui-lib
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Install Detours
      shell: pwsh
      run: |
        # Скачать и установить Microsoft Detours
        Invoke-WebRequest -Uri "https://github.com/microsoft/Detours/releases/download/v4.0.1/detours.v4.0.1.zip" -OutFile detours.zip
        Expand-Archive detours.zip -DestinationPath .
        Copy-Item -Path detours/lib.X64/* -Destination "C:/Program Files (x86)/Windows Kits/10/Lib/" -Recurse -Force
        Copy-Item -Path detours/include/* -Destination "C:/Program Files (x86)/Windows Kits/10/Include/" -Recurse -Force
        
    - name: Create build directory
      shell: cmd
      run: |
        mkdir template_build
        cd template_build
        
    - name: Configure CMake for Template
      shell: cmd
      run: |
        cmake -B template_build ^
          -S template ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_D3D9=ON ^
          -DBUILD_D3D10=ON ^
          -DBUILD_D3D11=ON ^
          -DBUILD_D3D12=ON ^
          -DBUILD_OPENGL=ON ^
          -DBUILD_VULKAN=ON
          
    - name: Build Template DLL
      shell: cmd
      run: |
        cmake --build template_build --config Release
        
    - name: Create template release package
      shell: bash
      run: |
        mkdir -p template_release/bin
        mkdir -p template_release/include
        cp template_build/bin/MyInjectLibrary.dll template_release/bin/
        cp template/ns_overlay.h template_release/include/
        
    - name: Upload template artifacts
      uses: actions/upload-artifact@v4
      with:
        name: template-inject-dll
        path: template_release/
        retention-days: 30
        
    - name: Upload template to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: template_release/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
